<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5; overflow: hidden;
        }
        #map { height: 100%; width: 100%; }

        /* 隐藏旧状态胶囊，由原生 Android 浮动卡片展示 */
        .info-pill { display: none !important; }

        /* 右上角图层切换开关 (标准 / 卫星) - 避开顶部浮动搜索栏 */
        .layer-switch {
            position: absolute; top: 112px; right: 14px; z-index: 1000;
            background: rgba(255, 255, 255, 0.94); color: #333; padding: 7px 14px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            box-shadow: 0 3px 12px rgba(0,0,0,0.22); backdrop-filter: blur(8px);
            display: flex; align-items: center; gap: 5px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.08); user-select: none;
            transition: all 0.2s ease;
        }
        .layer-switch:active {
            transform: scale(0.95); background: #eee;
        }

        /* 左下角大尺寸高敏缩放控制组 - 放置于左下侧，避开底部浮动坐标卡片与右侧原生定位FAB */
        .zoom-box {
            position: absolute; bottom: 100px; left: 14px; z-index: 1000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btn {
            width: 44px; height: 44px; background: rgba(255, 255, 255, 0.94);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #333; cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.22); user-select: none;
            border: 1px solid rgba(0,0,0,0.08); transition: all 0.15s ease;
        }
        .zoom-btn:active {
            transform: scale(0.90); background: #e0e0e0;
        }

        /* 现代质感定位图钉与呼吸光圈 */
        .pin-wrapper {
            position: relative; width: 30px; height: 30px;
        }
        .pin-radar {
            position: absolute; top: 0; left: 0; width: 30px; height: 30px;
            border-radius: 50%; background: rgba(234, 67, 53, 0.35);
            animation: radar-pulse 1.8s infinite ease-out;
        }
        .pin-center {
            position: absolute; top: 6px; left: 6px; width: 18px; height: 18px;
            border-radius: 50%; background-color: #EA4335; border: 3px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        }
        @keyframes radar-pulse {
            0% { transform: scale(0.7); opacity: 0.9; }
            100% { transform: scale(2.0); opacity: 0; }
        }

        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div class="info-pill">
        <span class="pill-dot"></span>
        <span id="pill-text">高德地图 · 轻触精准选点</span>
    </div>

    <!-- 卫星图切换按钮 -->
    <div class="layer-switch" id="layer-btn" onclick="toggleSatellite()">
        <span id="layer-btn-icon">🛰️</span>
        <span id="layer-btn-text">高清卫星</span>
    </div>

    <!-- 独立放大/缩小触控按钮 -->
    <div class="zoom-box">
        <div class="zoom-btn" onclick="zoomIn()">+</div>
        <div class="zoom-btn" onclick="zoomOut()">−</div>
    </div>

    <div id="map"></div>

    <script>
        var isSatellite = false;

        // 初始化 Leaflet，允许深层次超精细超采样缩放到 21 级 (亚米级操场跑道视角)
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            minZoom: 3,
            maxZoom: 21
        }).setView([39.908722, 116.397496], 15);

        // 1. 标准矢量道路地图
        var vectorLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            minZoom: 3,
            maxNativeZoom: 18,
            maxZoom: 21
        }).addTo(map);

        // 2. 高清卫星实拍影像 + 路网注记
        var satelliteBase = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            minZoom: 3,
            maxNativeZoom: 18,
            maxZoom: 21
        });
        var satelliteOverlay = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            minZoom: 3,
            maxNativeZoom: 18,
            maxZoom: 21
        });
        var satelliteGroup = L.layerGroup([satelliteBase, satelliteOverlay]);

        function toggleSatellite() {
            isSatellite = !isSatellite;
            var btnIcon = document.getElementById('layer-btn-icon');
            var btnText = document.getElementById('layer-btn-text');

            if (isSatellite) {
                map.removeLayer(vectorLayer);
                map.addLayer(satelliteGroup);
                btnIcon.innerText = "🗺️";
                btnText.innerText = "标准地图";
                document.getElementById('pill-text').innerText = "高清卫星航拍 · 操场细节清晰可见";
            } else {
                map.removeLayer(satelliteGroup);
                map.addLayer(vectorLayer);
                btnIcon.innerText = "🛰️";
                btnText.innerText = "高清卫星";
                updatePillText();
            }
        }

        function zoomIn() {
            map.setZoom(map.getZoom() + 1);
        }

        function zoomOut() {
            map.setZoom(map.getZoom() - 1);
        }

        function updatePillText() {
            var z = map.getZoom();
            if (isSatellite) {
                document.getElementById('pill-text').innerText = "高清卫星模式 · " + z + "级 (操场极清)";
            } else if (z >= 18) {
                document.getElementById('pill-text').innerText = "高精度极近视角 · " + z + "级";
            } else {
                document.getElementById('pill-text').innerText = "高德地图 · 轻触精准选点";
            }
        }

        map.on('zoomend', updatePillText);

        // 现代红点定位图钉
        var redIcon = L.divIcon({
            className: 'custom-pin-wrap',
            html: '<div class="pin-wrapper"><div class="pin-radar"></div><div class="pin-center"></div></div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        var currentMarker = L.marker([39.908722, 116.397496], {
            icon: redIcon,
            draggable: true
        }).addTo(map);

        function updateMarker(lat, lng, notify) {
            currentMarker.setLatLng([lat, lng]);
            if (notify && window.AndroidBridge) {
                window.AndroidBridge.onLocationSelected(lat, lng);
            }
        }

        currentMarker.on('dragend', function(e) {
            var coord = e.target.getLatLng();
            updateMarker(coord.lat, coord.lng, true);
        });

        map.on('click', function(e) {
            updateMarker(e.latlng.lat, e.latlng.lng, true);
        });

        // 原生 Java 调用的飞点函数 (接收 GCJ-02 坐标)
        function flyTo(lat, lng) {
            var targetZoom = map.getZoom() > 17 ? map.getZoom() : 17;
            map.flyTo([lat, lng], targetZoom, { duration: 0.8 });
            updateMarker(lat, lng, false);
        }
    </script>
</body>
</html>
