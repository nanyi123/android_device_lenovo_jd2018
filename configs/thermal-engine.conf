# jd2018 (SDM636) — thermal-engine 配置
#
# 本内核是 Asus msm-4.19，里面【没有】msm_thermal 驱动
# （drivers/thermal/qcom/ 下无 msm_thermal.c，运行时也没有 /sys/module/msm_thermal/*）。
# 因此 ZUI(A9 / 4.9 内核) 那份原厂 thermal-engine.conf 里的动作在本机全部初始化失败：
#
#   cluster0 / cluster1  需要 /sys/module/msm_thermal/cluster_info
#                        -> 日志 "update_cpu_topology: Cluster info node not found"
#                           "tmd_init_cluster_devs: No clusters found"，动作永不生效
#   ss / gpu             依赖上面注册出来的 cluster 设备，同样失效
#   vdd_restriction      需要 /sys/module/msm_thermal/vdd_restriction
#   battery              需要 /sys/class/power_supply/battery/system_temp_level
#                        （本机充电热保护由 smb2 驱动的 JEITA 完成，dmesg 可见 jeita_rule）
#
# CPU / GPU 的过热降频由内核 DT 自己负责，不经过本引擎：
#   quiet-therm-step  50 ℃ / 53 ℃  -> thermal-cpufreq-1 / -0（分档压频）
#   *-step            105 ℃        -> cpu*_isolate（隔离核心）
#   gpu-step          95 ℃         -> thermal-devfreq-0
#   mpm-lowf/camera-lowf 低温保护   -> 低频下限 + cx 限流
#
# 也【不】使用 lcd 动作：它同时写 /sys/class/leds/lcd-backlight/{brightness,max_brightness}，
# 会把 A14 框架 0-255 的亮度上限压成 action_info 的值；引擎若在 mitigation 期间被重启/杀掉，
# 屏幕会一直偏暗直到下次开机（2026-11-15 实测踩过，max_brightness 被压到 60/255）。
#
# 下面两条是 OEM（同 SoC、同 4.19 内核的 Asus 树）原生规则，后端实测可用：
#   "MODEM thermal mitigation available." / "ADSP thermal mitigation available."
# 传感器名按本内核真实的 thermal zone 名（quiet-therm-adc）。

[CAMERA_SKIN_EXIT_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 70000
thresholds_clr 65000
actions camera+camcorder
action_info 10+10

[MODEM_PROC_TEMP_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 82000 95000
thresholds_clr 80000 90000
actions modem_proc modem_proc
action_info 1 3
